name: Root workspace checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-behavior:
    name: Compile and non-desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.95.0 fmt --all -- --check
      - name: Default tests (no native desktop allocation)
        run: cargo +1.95.0 test --workspace --locked
      - name: All-feature compile lint (not live acceptance)
        run: cargo +1.95.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Architecture boundaries
        run: python tools/check_architecture.py --workspace . --rules architecture/baseline.json
      - name: Architecture checker negative tests
        run: python -m unittest discover -s tools -p test_check_architecture.py
