<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RWI Live · 本任务</title>
<style nonce="__NONCE__">:root{color-scheme:dark;font-family:system-ui}body{margin:0;background:#171b1e;color:#e7edeb;padding:24px}main{max-width:580px;margin:auto}header{display:flex;align-items:center;gap:10px;font-weight:650}.light{width:8px;height:8px;border-radius:50%;background:#7aa18e}h1{font-size:21px;margin:28px 0 10px}p{line-height:1.7;color:#a8b5b1;font-size:13px}button{font:inherit;color:#d7efe4;background:#253c33;border:1px solid #3b5b4c;border-radius:8px;padding:9px 14px;cursor:pointer}button:focus-visible{outline:2px solid #a4ebc8;outline-offset:3px}small{display:block;color:#80928b;margin-top:30px}</style>
<main><header><span class="light"></span>Real World Interaction</header><h1 id="state" role="status" aria-live="polite">正在连接本任务 Live</h1><p>切换到其他任务时，预览隐藏并清空；回到这个面板后恢复。关闭或切走此面板也会隐藏预览。</p><button id="toggle" type="button">暂时隐藏预览</button><small>只发布当前面板的可见性，不读取 Codex 对话内容、不发送键鼠。</small></main>
<script nonce="__NONCE__">(()=>{'use strict';const page='__PAGE__',base=location.pathname.replace(/\/$/,''),state=document.getElementById('state'),button=document.getElementById('toggle');let sequence=0,enabled=true,ended=false,lastResponse=0;
async function report(visible){if(ended)return;const sent=++sequence;try{const r=await fetch(base+'/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page,sequence:sent,visible}),keepalive:true,cache:'no-store'});const v=await r.json();if(sent<lastResponse||v.reason==='stale_event')return;lastResponse=sent;if(r.status===410||v.reason==='preview_stopped'){ended=true;state.textContent='此预览已结束或已被新面板接管';button.disabled=true;return;}state.textContent=r.ok&&v.accepted?(visible?'本任务面板可见 · 已连接':'隐藏请求已发送'):'连接暂不可用 · 预览将自动隐藏';}catch{if(sent>=lastResponse)state.textContent='连接暂不可用 · 预览将自动隐藏';}}
const visible=()=>enabled&&document.visibilityState==='visible';document.addEventListener('visibilitychange',()=>report(visible()));window.addEventListener('pagehide',()=>report(false));window.addEventListener('pageshow',()=>report(visible()));button.addEventListener('click',()=>{enabled=!enabled;button.textContent=enabled?'暂时隐藏预览':'恢复本任务预览';report(visible());});report(visible());setInterval(()=>{if(visible())report(true);},500);})();</script></html>
