[package]
name = "rwi-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Production binaries must understand the authenticated agent guard. Native
# targets/input remain explicit CLI grants; enabling this does not allocate one.
default = []
# Instrumented local model tests only. This build rejects every native target.
legacy-local = ["dep:rwi-macos", "dep:rwi-windows"]
synthetic-fixture = ["legacy-local", "rwi-core/fixture"]
link-fixture = ["synthetic-fixture"]
native-agent-worker = ["legacy-local", "rwi-native-link/legacy-workflow"]

[dependencies]
rwi-js = { path = "../rwi-js" }
rwi-link-trust = { path = "../rwi-link-trust" }
uuid.workspace = true
rwi-core = { path = "../rwi-core" }
rwi-macos = { path = "../rwi-macos", optional = true }
rwi-windows = { path = "../rwi-windows", optional = true }
rwi-imaging = { path = "../rwi-imaging" }
rwi-native-link = { path = "../rwi-native-link" }
rmcp = { version = "=1.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "io-std", "sync", "process"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64 = "=0.22.1"

[dev-dependencies]
rwi-agent = { path = "../rwi-agent", features = ["fixture"] }
rwi-macos = { path = "../rwi-macos" }
rwi-windows = { path = "../rwi-windows" }
rwi-core = { path = "../rwi-core", features = ["fixture"] }
tempfile.workspace = true
