[package]
name = "rcu-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rcu-core = { path = "../rcu-core" }
rcu-pointer = { path = "../rcu-pointer" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSObject", "NSGeometry", "objc2-core-foundation"] }
block2 = "=0.6.2"
core-graphics = { version = "=0.24.0", features = ["highsierra", "elcapitan"] }
core-foundation = "=0.10.1"
foreign-types = "=0.5.0"
libc = "=0.2.189"
png = "=0.18.1"

[dev-dependencies]
tempfile.workspace = true
